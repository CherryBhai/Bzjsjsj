name: M3U8 Live Recorder Test

on:
  workflow_dispatch:

jobs:
  record-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch Playlist and Record
        run: |
          # 1. Download the playlist using curl
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://ranapkx.site/RANAPK33m/TVD/tvd.m3u" > playlist.m3u
          
          # 2. Print the top of the file to verify it didn't get blocked
          echo "--- START OF DOWNLOADED FILE ---"
          head -n 10 playlist.m3u
          echo "--- END OF DOWNLOADED FILE ---"
          
          # 3. Search for the channel and grab the URL on the next line
          echo "Searching for Zee Cinemalu..."
          grep -i -A 1 "zee cinemalu" playlist.m3u > matched_lines.txt
          
          echo "Match results:"
          cat matched_lines.txt
          
          # Extract the URL (ignoring lines that start with #)
          STREAM_URL=$(grep -v "^#" matched_lines.txt | grep "http" | head -n 1 | tr -d '\r')
          
          if [[ -z "$STREAM_URL" ]]; then
            echo "Error: The channel was not found. The playlist link might be dead or blocking cloud servers."
            exit 1
          fi
          
          echo "Found stream URL: $STREAM_URL"
          
          # 4. Record for 2 minute (Forcing HLS format with -f hls to bypass PHP extension errors)
                    ffmpeg -y -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 2 -f hls -i "$STREAM_URL" -t 120 -c copy test_output.mp4

      - name: Upload Video for Download
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zee_cinemalu_recording
          path: test_output.mp4
          if-no-files-found: ignore
 
