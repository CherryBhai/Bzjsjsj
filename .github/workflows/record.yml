    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch Playlist and Record (1-Minute Test)
        run: |
          # 1. Fetch the playlist and extract the Zee Cinemalu URL
          python3 -c "
          import urllib.request
          
          url = 'https://ranapkx.site/RANAPK33m/TVD/tvd.m3u'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
          
          try:
              response = urllib.request.urlopen(req)
              lines = response.read().decode('utf-8').splitlines()
              
              m3u8_url = None
              for i, line in enumerate(lines):
                  if 'zee cinemalu' in line.lower():
                      for j in range(i + 1, len(lines)):
                          if lines[j].strip() and not lines[j].startswith('#'):
                              m3u8_url = lines[j].strip()
                              break
                      break
              
              if m3u8_url:
                  print(m3u8_url)
              else:
                  print('Error: Channel not found')
          except Exception as e:
              print(f'Failed to fetch: {e}')
          " > stream_url.txt

          # 2. Read the URL and record with FFmpeg using reconnect flags
          STREAM_URL=$(cat stream_url.txt)
          if [[ $STREAM_URL == http* ]]; then
            echo "Found stream URL: $STREAM_URL"
            echo "Starting 1-minute recording with reconnect protocols..."
            
            # The -reconnect flags force FFmpeg to stay alive during stream hiccups
            ffmpeg -y \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 2 \
              -i "$STREAM_URL" \
              -t 60 \
              -c copy zee_cinemalu_test.mp4
              
          else
            echo "Failed to get stream URL. Output was:"
            cat stream_url.txt
            exit 1
          fi

      - name: Upload Video for Download
        uses: actions/upload-artifact@v4
        with:
          name: zee_cinemalu_recording
          path: zee_cinemalu_test.mp4
