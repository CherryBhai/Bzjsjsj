name: M3U8 Live Recorder (5 Hours)

on:
  workflow_dispatch:

jobs:
  record-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch Playlist and Record (5 Hours)
        run: |
          # 18000 seconds equals exactly 5 hours
          END_TIME=$(( $(date +%s) + 18000 ))
          PART=1
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Fetching fresh playlist link..."
            # Updated to the new RANAPK33t link
            curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://ranapkx.site/RANAPK33t/TVD/tvd.m3u" > playlist.m3u
            STREAM_URL=$(grep -i -A 1 "zee cinemalu" playlist.m3u | grep -v "^#" | grep "http" | head -n 1 | tr -d '\r')
            
            if [[ -z "$STREAM_URL" ]]; then
              echo "Error: Channel not found. Retrying in 60 seconds..."
              sleep 60
              continue
            fi
            
            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -le 0 ]; then break; fi
            
            echo "Starting recording Part $PART..."
            # The loop continues even if FFmpeg hits an error
            ffmpeg -y -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 10 -f hls -i "$STREAM_URL" -t $REMAINING -c copy "zee_cinemalu_part${PART}.mp4" || echo "FFmpeg stopped."
            
            # Quality Check: Verify the output file is larger than 1MB
            FILE_SIZE=$(stat -c%s "zee_cinemalu_part${PART}.mp4" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -lt 1000000 ]; then
              echo "Stream rejected. File is only $FILE_SIZE bytes. Pausing 60s to bypass IP ban..."
              rm -f "zee_cinemalu_part${PART}.mp4"
              sleep 60
              continue
            fi
            
            PART=$((PART + 1))
            sleep 5
          done

      - name: Upload Video Parts to GitHub Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zee_cinemalu_recording
          path: "*.mp4"
          if-no-files-found: ignore
 
