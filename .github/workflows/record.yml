name: M3U8 Live Recorder (Crash-Proof)

on:
  workflow_dispatch:

jobs:
  record-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch Playlist and Record (2 Hours)
        run: |
          # 7200 seconds equals exactly 2 hours to finish the 10:30 PM window
          END_TIME=$(( $(date +%s) + 7200 ))
          PART=1
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Fetching fresh playlist link..."
            curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://ranapkx.site/RANAPK33m/TVD/tvd.m3u" > playlist.m3u
            STREAM_URL=$(grep -i -A 1 "zee cinemalu" playlist.m3u | grep -v "^#" | grep "http" | head -n 1 | tr -d '\r')
            
            if [[ -z "$STREAM_URL" ]]; then
              echo "Error: Channel not found. Retrying in 30 seconds..."
              sleep 30
              continue
            fi
            
            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -le 0 ]; then break; fi
            
            echo "Starting recording Part $PART. Time remaining: $REMAINING seconds."
            
            # The '|| true' tells GitHub to ignore stream glitches and keep the loop running!
            ffmpeg -y -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 10 -f hls -i "$STREAM_URL" -t $REMAINING -c copy "zee_cinemalu_part${PART}.mp4" || true
            
            PART=$((PART + 1))
            # Wait 5 seconds before pulling a new link
            sleep 5
          done

      - name: Upload Video Parts to GitHub Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zee_cinemalu_recovered_recording
          path: "*.mp4"
          if-no-files-found: ignore
 
