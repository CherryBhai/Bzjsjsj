name: M3U8 Live Recorder (GitHub Storage)

on:
  workflow_dispatch:

jobs:
  record-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch Playlist and Record (10 Minutes)
        run: |
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://ranapkx.site/RANAPK33m/TVD/tvd.m3u" > playlist.m3u
          grep -i -A 1 "zee cinemalu" playlist.m3u > matched_lines.txt
          
          STREAM_URL=$(grep -v "^#" matched_lines.txt | grep "http" | head -n 1 | tr -d '\r')
          
          if [[ -z "$STREAM_URL" ]]; then
            echo "Error: Channel not found."
            exit 1
          fi
          
          echo "Found URL. Starting 10-minute recording..."
          ffmpeg -y -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 2 -f hls -i "$STREAM_URL" -t 60 -c copy final_video.mp4

      - name: Upload Video to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zee_cinemalu_10_minutes
          path: final_video.mp4
          if-no-files-found: ignore
