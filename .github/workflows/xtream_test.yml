name: Upclear Video AI Pipeline

on:
  workflow_dispatch:

jobs:
  video_upscale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (FFmpeg & Vulkan)
        run: |
          sudo apt-get update
          # FFmpeg handles video processing, mesa-vulkan-drivers allows CPU upscaling
          sudo apt-get install -y ffmpeg mesa-vulkan-drivers vulkan-tools

      - name: Set up Python (For Google Drive Download)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install gdown
        run: pip install gdown

      - name: Download Real-ESRGAN NCNN Binary
        run: |
          wget https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          unzip realesrgan-ncnn-vulkan-20220424-ubuntu.zip -d realesrgan
          chmod +x realesrgan/realesrgan-ncnn-vulkan

      - name: Download Source Video from Google Drive
        run: |
          # Extracts the file ID from your provided URL and bypasses the Google virus scan warning
          gdown "1llpHGkS0Nk_OQwnavQJ4dpefTx-kUg3K" -O input.mp4

      - name: Extract Audio and Video Frames
        run: |
          mkdir original_frames
          mkdir upscaled_frames
          
          # Extracts the original audio track to a separate file
          ffmpeg -i input.mp4 -q:a 0 -map a original_audio.aac
          
          # Splits the video into individual PNG frames (e.g., frame_00000001.png)
          ffmpeg -i input.mp4 original_frames/frame_%08d.png

      - name: Upscale All Frames via True AI (CPU)
        run: |
          # Real-ESRGAN natively supports processing an entire directory of frames
          # We are using the realesrgan-x4plus model for photorealistic texture synthesis
          ./realesrgan/realesrgan-ncnn-vulkan -i original_frames -o upscaled_frames -n realesrgan-x4plus -g 0

      - name: Reassemble Video, Add Audio & Boost Brightness
        run: |
          # -framerate 24 assumes a standard cinema framerate (change if your original is 30fps or 60fps)
          # -vf "eq=brightness=0.1" mathematically increases the visual brightness by 10%
          ffmpeg -framerate 24 -i upscaled_frames/frame_%08d.png -i original_audio.aac -vf "eq=brightness=0.1" -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a aac -strict experimental final_upscaled_video.mp4

      - name: Upload Final Upscaled Video
        uses: actions/upload-artifact@v4
        with:
          name: final-remastered-video
          path: final_upscaled_video.mp4
          retention-days: 1
