name: Upclear CPU Upscale Test

on:
  workflow_dispatch: # Allows you to manually trigger the test from the Actions tab

jobs:
  upscale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Real-ESRGAN NCNN Binary
        run: |
          # Fetches the standalone C++ executable that bypasses PyTorch dependencies
          wget https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          unzip realesrgan-ncnn-vulkan-20220424-ubuntu.zip -d realesrgan
          chmod +x realesrgan/realesrgan-ncnn-vulkan

      - name: Download Source Image
        run: |
          # Downloads the low-quality image via the direct link found in the screenshot
          curl -o input.jpg "https://i.postimg.cc/W3N9JK8T/61316839.jpg"

      - name: Execute Upscaling on CPU
        run: |
          # -i is the input image
          # -o is the output file
          # -n specifies the compact model weight
          # -g -1 forces the engine to bypass Vulkan/GPU and run exclusively on the GitHub CPU
          ./realesrgan/realesrgan-ncnn-vulkan -i input.jpg -o output_upscaled.jpg -n realesr-animevideov3 -g -1

      - name: Upload Upscaled Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upscaled-image
          path: output_upscaled.jpg
          retention-days: 1 # Keeps repository storage clean
