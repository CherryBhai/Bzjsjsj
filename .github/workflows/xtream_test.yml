name: Upclear Video AI Pipeline (BSRGAN)

on:
  workflow_dispatch:

jobs:
  video_upscale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install PyTorch, Dependencies & gdown
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python requests matplotlib scipy gdown

      - name: Clone BSRGAN and Download Weights
        run: |
          git clone https://github.com/cszn/BSRGAN.git
          mkdir -p BSRGAN/model_zoo
          wget https://github.com/cszn/KAIR/releases/download/v1.0/BSRGAN.pth -P BSRGAN/model_zoo

      - name: Patch BSRGAN for CPU Execution
        run: |
          cd BSRGAN
          sed -i 's/torch.cuda.current_device()/0/g' main_test_bsrgan.py
          sed -i "s/device = torch.device('cuda'/device = torch.device('cpu'/g" main_test_bsrgan.py
          sed -i 's/model.cuda()/model.cpu()/g' main_test_bsrgan.py

      - name: Download Source Video from Google Drive
        run: |
          # Bypasses the virus scan warning to download the file directly
          gdown "1llpHGkS0Nk_OQwnavQJ4dpefTx-kUg3K" -O input.mp4

      - name: Extract Audio and Video Frames
        run: |
          # Deletes BSRGAN's stock sample images so it does not waste compute time on them
          rm -rf BSRGAN/testsets/RealSRSet/*
          
          # Extracts the original audio track
          ffmpeg -i input.mp4 -q:a 0 -map a original_audio.aac
          
          # Slices the video into frames and drops them directly where BSRGAN looks for inputs
          ffmpeg -i input.mp4 BSRGAN/testsets/RealSRSet/frame_%08d.png

      - name: Execute BSRGAN on CPU
        run: |
          cd BSRGAN
          # Processes every frame placed in the RealSRSet folder
          python main_test_bsrgan.py

      - name: Reassemble Video, Add Audio & Boost Brightness
        run: |
          # Uses a glob pattern (*.png) because BSRGAN alters the output filename slightly
          # -vf "eq=brightness=0.1" mathematically increases visual brightness by 10%
          ffmpeg -framerate 24 -pattern_type glob -i "BSRGAN/testsets/RealSRSet_results_x4/*.png" -i original_audio.aac -vf "eq=brightness=0.1" -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a aac -strict experimental final_upscaled_video.mp4

      - name: Upload Final Upscaled Video
        uses: actions/upload-artifact@v4
        with:
          name: final-remastered-video
          path: final_upscaled_video.mp4
          retention-days: 1
 
