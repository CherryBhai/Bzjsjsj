name: Upclear CPU Upscale Test

on:
  workflow_dispatch:

jobs:
  upscale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Software Vulkan Driver (Lavapipe)
        run: |
          # Injects a CPU-based Vulkan rasterizer into the runner
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          
      - name: Download Real-ESRGAN NCNN Binary
        run: |
          wget https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          unzip realesrgan-ncnn-vulkan-20220424-ubuntu.zip -d realesrgan
          chmod +x realesrgan/realesrgan-ncnn-vulkan

      - name: Download Source Image
        run: |
          curl -o input.jpg "https://i.postimg.cc/W3N9JK8T/61316839.jpg"

      - name: Execute Upscaling via CPU Software Rasterizer
        run: |
          # With mesa-vulkan-drivers installed, -g 0 will target the CPU via Lavapipe
          ./realesrgan/realesrgan-ncnn-vulkan -i input.jpg -o output_upscaled.jpg -n realesr-animevideov3 -g 0

      - name: Upload Upscaled Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upscaled-image
          path: output_upscaled.jpg
          retention-days: 1
 
