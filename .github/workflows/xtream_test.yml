name: Upclear Unified AI Upscale (BSRGAN)

on:
  workflow_dispatch:

jobs:
  unified_upscale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTorch and Dependencies
        run: |
          # Added matplotlib and scipy to fulfill the requirements of BSRGAN's utility scripts
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python requests matplotlib scipy
          git clone https://github.com/cszn/BSRGAN.git

      - name: Download Source Image
        run: |
          mkdir -p BSRGAN/testsets/input
          curl -o BSRGAN/testsets/input/61316839.jpg "https://i.postimg.cc/W3N9JK8T/61316839.jpg"

      - name: Execute BSRGAN on CPU
        run: |
          cd BSRGAN
          python main_test_bsrgan.py

      - name: Upload Restored Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upscaled-unified-image
          path: BSRGAN/test_results/
          retention-days: 1
