name: Upclear Unified AI Upscale (BSRGAN)

on:
  workflow_dispatch:

jobs:
  unified_upscale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTorch and Dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python requests matplotlib scipy
          git clone https://github.com/cszn/BSRGAN.git

      - name: Patch BSRGAN for CPU Execution
        run: |
          cd BSRGAN
          sed -i 's/torch.cuda.current_device()/0/g' main_test_bsrgan.py
          sed -i "s/device = torch.device('cuda'/device = torch.device('cpu'/g" main_test_bsrgan.py
          sed -i 's/model.cuda()/model.cpu()/g' main_test_bsrgan.py

      - name: Download BSRGAN Pre-trained Weights
        run: |
          mkdir -p BSRGAN/model_zoo
          wget https://github.com/cszn/KAIR/releases/download/v1.0/BSRGAN.pth -P BSRGAN/model_zoo

      - name: Prepare Input Directory and Download Source Image
        run: |
          # Deletes BSRGAN's default stock images so the CPU does not waste time processing them
          rm -rf BSRGAN/testsets/RealSRSet/*
          # Downloads your image directly into the folder main_test_bsrgan.py is hardcoded to read
          curl -o BSRGAN/testsets/RealSRSet/61316839.jpg "https://i.postimg.cc/W3N9JK8T/61316839.jpg"

      - name: Execute BSRGAN on CPU
        run: |
          cd BSRGAN
          python main_test_bsrgan.py

      - name: Upload Restored Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upscaled-unified-image
          # Targets the exact hardcoded directory where BSRGAN saves its final files
          path: BSRGAN/testsets/RealSRSet_results_x4/
          retention-days: 1
